name: Build and deploy image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'Home/**'
      - 'Dashboard/**'
      - 'Dictionary/**'
      - 'Stories/**'
      - 'Topics/**'
      - 'docker/**'
      - '.dockerignore'
      - '.gitattributes'
      - '.github/workflows/build-image.yml'
      - 'Dockerfile'
      - 'manage.py'
      - 'docker-compose.yml'
      - 'docker-compose.build.yml'
      - 'requirements.in'
      - 'requirements.txt'
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
  workflow_dispatch:

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  IMAGE_TAG: ${{ github.sha }}
  IMAGE: ghcr.io/jaypeefern/library-management-system

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Verify image identity
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected a full lowercase 40-character commit SHA." >&2
            exit 1
          fi

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Django regression suite
        env:
          SECRET_KEY: synthetic-ci-only-secret
          DJANGO_DEBUG: 'true'
        run: docker run --rm --env SECRET_KEY --env DJANGO_DEBUG "$IMAGE:$IMAGE_TAG" python manage.py test

  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      image-digest: ${{ steps.publish-image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - id: publish-image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max

      - name: Attest published image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish-image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  verify-image:
    needs: publish
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      attestations: read
      packages: read
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify immutable image was pushed
        env:
          IMAGE_REFERENCE: ghcr.io/jaypeefern/library-management-system@${{ needs.publish.outputs.image-digest }}
        run: docker buildx imagetools inspect "$IMAGE_REFERENCE"

      - name: Verify signed build provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REFERENCE: ghcr.io/jaypeefern/library-management-system@${{ needs.publish.outputs.image-digest }}
        run: >-
          gh attestation verify "oci://$IMAGE_REFERENCE"
          --bundle-from-oci
          --repo "$GITHUB_REPOSITORY"
          --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build-image.yml"
          --source-digest "$GITHUB_SHA"

  deploy:
    needs: [build, verify-image, publish]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions: {}
    steps:
      - name: Pin and trigger Coolify deploy
        env:
          URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.image-digest }}
        run: |
          set -euo pipefail

          if [ -z "$URL" ] && [ -z "$TOKEN" ] && [ -z "$API_TOKEN" ]; then
            echo "Coolify deployment secrets are not set; image build is ready for manual deployment." >&2
            exit 0
          fi

          if [ -z "$URL" ] || [ -z "$TOKEN" ] || [ -z "$API_TOKEN" ]; then
            echo "Set all of COOLIFY_WEBHOOK_URL, COOLIFY_TOKEN, and COOLIFY_API_TOKEN." >&2
            exit 1
          fi

          PARSED_WEBHOOK=$(python3 - "$URL" <<'PY'
          from urllib.parse import parse_qs, urlparse
          import re
          import sys

          webhook = sys.argv[1]
          parsed = urlparse(webhook)
          try:
              hostname = parsed.hostname
              parsed.port
          except ValueError:
              raise SystemExit("Invalid COOLIFY_WEBHOOK_URL host or port")
          query = parse_qs(parsed.query, keep_blank_values=True)
          values = query.get("uuid", [])
          if parsed.scheme != "https" or not hostname or parsed.username or parsed.password:
              raise SystemExit("COOLIFY_WEBHOOK_URL must use HTTPS and contain no embedded credentials")
          if parsed.fragment or parsed.path.rstrip("/") != "/api/v1/deploy" or len(values) != 1:
              raise SystemExit("COOLIFY_WEBHOOK_URL must be an HTTPS resource deploy webhook with one uuid")
          if "tag" in query or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_-]*", values[0]):
              raise SystemExit("COOLIFY_WEBHOOK_URL has an unsupported tag or application UUID")
          print(f"{parsed.scheme}://{parsed.netloc}")
          print(values[0])
          PY
          )
          mapfile -t VALUES <<< "$PARSED_WEBHOOK"
          if [ "${#VALUES[@]}" -ne 2 ]; then
            echo "Could not derive Coolify origin and application UUID." >&2
            exit 1
          fi

          COOLIFY_ORIGIN="${VALUES[0]}"
          APPLICATION_UUID="${VALUES[1]}"
          API_ROOT="${COOLIFY_ORIGIN}/api/v1"
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Expected a SHA-256 image digest from the build." >&2
            exit 1
          fi
          IMAGE_REFERENCE="ghcr.io/jaypeefern/library-management-system@${IMAGE_DIGEST}"

          curl --fail-with-body --silent --show-error --output /dev/null --request PATCH \
            "$API_ROOT/applications/$APPLICATION_UUID" \
            -H "Authorization: Bearer $API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$(jq -n --arg sha "$IMAGE_TAG" '{git_commit_sha: $sha}')"

          COOLIFY_STATE=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $API_TOKEN" \
            "$API_ROOT/applications/$APPLICATION_UUID")
          if ! jq -e --arg sha "$IMAGE_TAG" '.git_commit_sha == $sha' \
            <<< "$COOLIFY_STATE" >/dev/null; then
            echo "Coolify did not retain the expected source commit; refusing deployment." >&2
            exit 1
          fi

          ENV_URL="$API_ROOT/applications/$APPLICATION_UUID/envs"
          ENVIRONMENT_VARS=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $API_TOKEN" "$ENV_URL")
          ENV_UUID=$(jq -r '[.[] | select(.key == "IMAGE_REFERENCE" and .is_preview != true)][0].uuid // empty' \
            <<< "$ENVIRONMENT_VARS")
          if [ -n "$ENV_UUID" ]; then
            curl --fail-with-body --silent --show-error --output /dev/null --request PATCH \
              "$ENV_URL" \
              -H "Authorization: Bearer $API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$(jq -n --arg value "$IMAGE_REFERENCE" '{key: "IMAGE_REFERENCE", value: $value, is_preview: false, is_literal: true}')"
          else
            curl --fail-with-body --silent --show-error --output /dev/null --request POST \
              "$ENV_URL" \
              -H "Authorization: Bearer $API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$(jq -n --arg value "$IMAGE_REFERENCE" '{key: "IMAGE_REFERENCE", value: $value, is_preview: false, is_literal: true}')"
          fi

          VERIFIED_ENVIRONMENT_VARS=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $API_TOKEN" "$ENV_URL")
          if ! jq -e --arg value "$IMAGE_REFERENCE" \
            '[.[] | select(.key == "IMAGE_REFERENCE" and .is_preview != true and (.value == $value or .real_value == $value))] | length == 1' \
            <<< "$VERIFIED_ENVIRONMENT_VARS" >/dev/null; then
            echo "Coolify did not retain the expected image digest; refusing deployment." >&2
            exit 1
          fi

          curl --fail-with-body --silent --show-error --output /dev/null --request POST \
            -H "Authorization: Bearer $TOKEN" "$URL"
          echo "Coolify deploy webhook triggered for $IMAGE_REFERENCE."
